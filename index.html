<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>단체복 피팅 랩</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Do+Hyeon&family=Hahmlet:wght@500;600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600&family=Nanum+Myeongjo:wght@800&family=Nanum+Pen+Script&display=swap">
<style>
/* Layout: 피팅 스테이지(좌·고정, 테크팩 도트 그리드) + 작업 패널(우). 모바일은 스테이지 상단 고정 + 패널 스크롤 */
:root{
  --bg:#ECF0EE; --surface:#FFFFFF; --sunk:#F3F6F5; --ink:#16201E; --muted:#5A6865;
  --line:#D2DAD7; --line-strong:#AEBAB6; --accent:#1C6A65; --accent-soft:#DCEDEA; --on-accent:#FFFFFF;
  --stage:#E1E7E4; --dot:rgba(22,32,30,.11); --shadow:rgba(22,32,30,.10); --danger:#B3261E;
  --f-display:"Hahmlet","Nanum Myeongjo",Georgia,serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1514; --surface:#171E1D; --sunk:#1D2524; --ink:#E4EBE9; --muted:#93A29F;
    --line:#2B3634; --line-strong:#465451; --accent:#62C0B6; --accent-soft:#1D3533; --on-accent:#0B1413;
    --stage:#131A19; --dot:rgba(228,235,233,.07); --shadow:rgba(0,0,0,.4); --danger:#E5675F; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1514; --surface:#171E1D; --sunk:#1D2524; --ink:#E4EBE9; --muted:#93A29F;
  --line:#2B3634; --line-strong:#465451; --accent:#62C0B6; --accent-soft:#1D3533; --on-accent:#0B1413;
  --stage:#131A19; --dot:rgba(228,235,233,.07); --shadow:rgba(0,0,0,.4); --danger:#E5675F; color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink); font:400 15px/1.55 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 40px;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto}
.sr{position:absolute;left:-9999px}

.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:20px 16px}
.eyebrow{font:500 .7rem/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.top h1{font:600 1.75rem/1.15 var(--f-display);margin:6px 0 0;letter-spacing:-.01em;text-wrap:balance}
.top p{margin:4px 0 0;color:var(--muted);font-size:.9rem;max-width:56ch}

.app{display:grid;gap:20px;grid-template-columns:minmax(0,1fr)}
.stage{
  background-color:var(--stage); background-image:radial-gradient(var(--dot) 1px,transparent 1.3px); background-size:14px 14px;
  border:1px solid var(--line); border-radius:14px; overflow:hidden; display:flex; flex-direction:column; min-width:0;
}
@media (min-width:900px){
  .app{grid-template-columns:minmax(0,1fr) 440px;align-items:start}
  .stage{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);height:min(calc(100vh - 140px),860px);min-height:520px}
}
@media (max-width:899px){
  .stage{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;height:46vh;min-height:300px;box-shadow:0 6px 16px -10px var(--shadow)}
  .top{padding-block:14px 12px}
  .top h1{font-size:1.4rem}
}
.stage-head{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;flex-wrap:wrap}
.tag{font:500 .7rem/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tag b{color:var(--ink);font-weight:500}
.tools{display:flex;gap:6px}
.stage svg#fig{flex:1;min-height:0;width:100%;display:block}
.stage-foot{padding:8px 12px 12px;font-size:.82rem;color:var(--muted);text-align:center;min-height:1.6em}
.ruler text{fill:var(--muted);font:9px var(--f-mono)}
.ruler path{stroke:var(--line-strong)}

.btn{
  display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);
  border-radius:8px;padding:7px 11px;font-size:.84rem;font-weight:500;cursor:pointer;white-space:nowrap;
  transition:border-color .15s,background .15s;
}
.btn:hover:not(:disabled){border-color:var(--line-strong)}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.link{border:0;background:none;padding:4px 0;color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.btn svg{width:15px;height:15px;flex:none}
.panel{display:flex;flex-direction:column;gap:16px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.sec{display:flex;flex-direction:column;gap:10px}
.sec + .sec{margin-top:18px;padding-top:16px;border-top:1px dashed var(--line)}
.sec-title{font:500 .72rem/1.2 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0;display:flex;justify-content:space-between;align-items:center;gap:8px}
.sec-title span{text-transform:none;letter-spacing:0;font-family:var(--f-body);color:var(--ink);font-size:.82rem;text-align:right}
h2.card-title{font:600 1.05rem/1.3 var(--f-display);margin:0 0 12px}
.hint{font-size:.8rem;color:var(--muted);margin:0}
.hint.warn{color:var(--danger)}

.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chip{
  display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--sunk);border-radius:999px;
  padding:6px 12px 6px 7px;font-size:.84rem;cursor:pointer;white-space:nowrap;
}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.chip .dots{display:inline-flex}
.chip .dots i{width:14px;height:14px;border-radius:50%;border:1px solid var(--line-strong);margin-left:-4px}
.chip .dots i:first-child{margin-left:0}
.chip svg{width:18px;height:18px;border-radius:50%;border:1px solid var(--line-strong)}

.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);margin:-4px -4px 16px;padding:0 4px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:10px 14px;border-bottom:2px solid transparent;margin-bottom:-1px;color:var(--muted);font-weight:500;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

.grp-label{font-size:.78rem;font-weight:600;color:var(--ink);margin:4px 0 -2px}
.styles{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.style-card{
  border:1px solid var(--line);background:var(--sunk);border-radius:10px;padding:8px 6px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;transition:border-color .15s;
}
.style-card:hover{border-color:var(--line-strong)}
.style-card[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.style-card svg{width:100%;height:80px}
.style-card .nm{font-size:.82rem;font-weight:500;line-height:1.3}
.style-card .nt{font-size:.7rem;color:var(--muted);line-height:1.3}

.seg{display:inline-flex;background:var(--sunk);border:1px solid var(--line);border-radius:9px;padding:3px;gap:2px;align-self:flex-start;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 12px;border-radius:6px;font-size:.84rem;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px var(--shadow)}
.seg button small{display:block;font-size:.68rem;color:var(--muted);line-height:1.2}

.current{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.current .big{width:44px;height:44px;border-radius:10px;border:1px solid var(--line-strong);flex:none}
.current .nm{font-weight:600}
.hex{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.pal-group{display:flex;flex-direction:column;gap:6px}
.pal-label{font-size:.74rem;color:var(--muted)}
.sw-row{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:32px;height:32px;border-radius:50%;border:1px solid var(--line-strong);cursor:pointer;padding:0;transition:transform .12s}
.sw:hover{transform:scale(1.08)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ink)}
.custom{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.custom input[type=color]{width:44px;height:36px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:2px;cursor:pointer}
.field{
  height:38px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);padding:0 10px;font-size:.9rem;min-width:0;
}
.custom .field{width:110px;font:500 .86rem var(--f-mono);text-transform:uppercase}
.field[aria-invalid="true"]{border-color:var(--danger)}
.form-row{display:flex;flex-direction:column;gap:4px}
.form-row label{font-size:.78rem;color:var(--muted)}

.fonts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.font-card{border:1px solid var(--line);background:var(--sunk);border-radius:10px;padding:10px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0}
.font-card .smp{font-size:1.35rem;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.font-card .nt{font-size:.72rem;color:var(--muted)}
.font-card[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}

.table-wrap{overflow-x:auto}
table.spec{width:100%;border-collapse:collapse;font-size:.86rem}
.spec th{font:500 .74rem var(--f-body);color:var(--muted);text-align:left;padding:9px 10px 9px 0;border-bottom:1px solid var(--line);vertical-align:top;white-space:nowrap;width:1%}
.spec td{padding:9px 0;border-bottom:1px solid var(--line);vertical-align:top}
.spec tr:last-child th,.spec tr:last-child td{border-bottom:0}
.spec td small{color:var(--muted);font-size:.76rem}
.cl{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap}
.cl i{width:14px;height:14px;border-radius:4px;border:1px solid var(--line-strong);flex:none}
.row-actions{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:12px;flex-wrap:wrap}
pre#spec-text{position:absolute;left:-9999px;top:0;white-space:pre}

.save-row{display:flex;gap:8px}
.save-row .field{flex:1}
.looks{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px;margin-top:12px}
.look{position:relative;border:1px solid var(--line);border-radius:10px;background:var(--sunk);padding:6px 6px 8px;display:flex;flex-direction:column;align-items:center}
.look .load{border:0;background:none;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;width:100%}
.look svg{width:100%;height:130px}
.look .nm{font-size:.78rem;font-weight:500;overflow-wrap:anywhere;text-align:center}
.look .del{position:absolute;top:4px;right:4px;border:1px solid var(--line);background:var(--surface);border-radius:6px;font-size:.68rem;padding:2px 6px;cursor:pointer;color:var(--muted)}
.look .del.armed{color:#FFFFFF;background:var(--danger);border-color:var(--danger)}
.empty{color:var(--muted);font-size:.85rem;margin:10px 0 0}

.toast{
  position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);
  background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:.86rem;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:20;
  max-width:calc(100vw - 32px);text-align:center;
}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:420px){.btn .lbl{display:none}.btn{padding:7px 9px}}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow">Group Apparel · Virtual Fitting</div>
      <h1>단체복 피팅 랩</h1>
      <p>상의 스타일과 배색, 팀명 프린트를 골라 마네킹에 바로 입혀 봅니다. 반티·동아리 후드·워크숍 카라티 시안을 주문 전에 비교해 보세요.</p>
    </div>
  </header>

  <main class="app">
    <section class="stage" aria-label="피팅 스테이지">
      <div class="stage-head">
        <div class="tag"><span>Front · 앞판</span><span>165 cm · 체형 <b id="build-label">보통</b></span></div>
        <div class="tools">
          <button class="btn" id="btn-undo" data-act="undo" data-key="undo" title="실행 취소">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg><span class="lbl">실행 취소</span></button>
          <button class="btn" data-act="random" data-key="random" title="랜덤 디자인">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5"/><path d="M4 20 21 3"/><path d="M21 16v5h-5"/><path d="m15 15 6 6"/><path d="M4 4l5 5"/></svg><span class="lbl">랜덤</span></button>
          <button class="btn" data-act="reset" data-key="reset" title="기본 디자인으로 초기화">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg><span class="lbl">초기화</span></button>
        </div>
      </div>
      <svg id="fig" viewBox="0 18 300 604" preserveAspectRatio="xMidYMid meet" role="img" aria-label="현재 디자인의 상의를 입은 마네킹"></svg>
      <div class="stage-foot" id="caption"></div>
    </section>

    <aside class="panel">
      <div class="card">
        <div class="sec">
          <h3 class="sec-title">예시 디자인</h3>
          <div class="chips" id="presets"></div>
        </div>
      </div>

      <div class="card">
        <nav class="tabs" role="tablist" id="tabs" aria-label="편집 항목"></nav>
        <div id="panel-body" role="tabpanel"></div>
      </div>

      <div class="card">
        <h2 class="card-title">디자인 사양서</h2>
        <div class="table-wrap" id="spec"></div>
        <div class="row-actions">
          <span class="hex" id="spec-date"></span>
          <button class="btn" data-act="copy" data-key="copy">사양 텍스트 복사</button>
        </div>
        <pre id="spec-text" aria-hidden="true"></pre>
      </div>

      <div class="card">
        <h2 class="card-title">저장한 디자인</h2>
        <form class="save-row" id="save-form">
          <label for="look-name" class="sr">디자인 이름</label>
          <input id="look-name" class="field" type="text" maxlength="24" placeholder="예: 2반 반티 A안">
          <button class="btn primary" type="submit">현재 디자인 저장</button>
        </form>
        <div id="looks"></div>
      </div>
    </aside>
  </main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ============================================================
   1) 데이터 — 색상·패턴·서체·예시 디자인 (확장 지점)
   ============================================================ */
const PALETTE = [
  { group:'베이직', colors:[['화이트','#F6F6F2'],['아이보리','#F2ECDF'],['멜란지 그레이','#B9BBBD'],['차콜','#3A4249'],['네이비','#1F2A44'],['블랙','#1D1D1F']] },
  { group:'팀 컬러', colors:[['레드','#D2283E'],['버건디','#6E2735'],['오렌지','#EE8A2A'],['옐로','#EFC12F'],['그린','#2E9E4F'],['틸','#23817E'],['로열 블루','#1E63D2'],['스카이','#6FB3E6'],['퍼플','#6A41B3'],['핫핑크','#E23B8A']] },
  { group:'파스텔', colors:[['민트','#A9DCCB'],['파스텔 블루','#B5D5EF'],['라일락','#C8B7E2'],['로즈','#E9B5C1'],['피치','#F4C4A6'],['버터','#F3E2A0']] },
  { group:'어스톤', colors:[['베이지','#D9C7AC'],['스톤','#C9C4BA'],['카멜','#B3874F'],['카키','#8A8358'],['올리브','#5B6237'],['브라운','#6B4A35']] },
];
const SKINS = [['화이트 마네킹','#ECE8E2'],['라이트 베이지','#E8CDB2'],['미디엄','#C99B76'],['딥 브라운','#8A5A40'],['스틸 그레이','#9EA4A6']];
const BASES = [['데님','#3F5573'],['블랙 팬츠','#26282D'],['베이지 치노','#CDBB9C']];
const BUILDS = { slim:{label:'슬림',k:.92}, regular:{label:'보통',k:1}, broad:{label:'넓음',k:1.1} };
const PATTERNS = [['solid','솔리드'],['border','보더 스트라이프'],['check','깅엄 체크'],['dot','도트']];
const FONTS = {
  gothic:  { label:'블랙 고딕', note:'굵고 또렷함', css:"'Black Han Sans'", w:400, k:1 },
  dohyeon: { label:'도현',     note:'친근한 고딕', css:"'Do Hyeon'", w:400, k:1 },
  myeongjo:{ label:'명조',     note:'클래식',     css:"'Nanum Myeongjo'", w:800, k:.95 },
  pen:     { label:'손글씨',   note:'캐주얼',     css:"'Nanum Pen Script'", w:400, k:1.3 },
};
const PRINT_POS = [['chest','왼쪽 가슴'],['center','가슴 중앙'],['none','없음']];
const TABS = [['style','스타일'],['color','색상·배색'],['print','프린트'],['body','마네킹']];

/* ============================================================
   2) 색상 유틸
   ============================================================ */
const rgb = h => { h=h.replace('#',''); return [0,2,4].map(i=>parseInt(h.slice(i,i+2),16)); };
const hex = (r,g,b) => '#'+[r,g,b].map(v=>Math.round(Math.max(0,Math.min(255,v))).toString(16).padStart(2,'0')).join('').toUpperCase();
const mix = (h,t) => { const [r,g,b]=rgb(h), to=t<0?0:255, a=Math.abs(t); return hex(r+(to-r)*a,g+(to-g)*a,b+(to-b)*a); };
const lum = h => { const [r,g,b]=rgb(h).map(v=>{v/=255;return v<=.03928?v/12.92:((v+.055)/1.055)**2.4;}); return .2126*r+.7152*g+.0722*b; };
const lineOf = c => mix(c, lum(c) < .05 ? .32 : -.36);
const accentOf = c => lum(c) > .42 ? mix(c,-.24) : mix(c,.3);
const NAMES = new Map([...PALETTE.flatMap(g=>g.colors), ...SKINS, ...BASES].map(([n,h])=>[h.toUpperCase(),n]));
const colorName = h => NAMES.get(h.toUpperCase()) || '사용자 지정';
const esc = t => String(t).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ============================================================

const HEXRE = /^#[0-9A-Fa-f]{6}$/;
function sanitize(s, keepBody){
  const base = Object.assign(clone(PRESETS[0].s), {body:clone(DEFAULT_BODY)});
  s = s || {};
  const out = Object.assign({}, base, s);
  out.print = Object.assign({}, base.print, s.print || {});
  out.body  = Object.assign({}, base.body, keepBody || {}, s.body || {});
  if(!STYLES.some(x=>x.id===out.style)) out.style = base.style;
  for(const k of ['color','trim']) if(!HEXRE.test(out[k]||'')) out[k] = base[k];
  if(out.sleeve && !HEXRE.test(out.sleeve)) out.sleeve = null;
  if(!PATTERNS.some(p=>p[0]===out.pattern)) out.pattern = 'solid';
  if(!FONTS[out.print.font]) out.print.font = 'gothic';
  if(!PRINT_POS.some(p=>p[0]===out.print.pos)) out.print.pos = 'center';
  if(!BUILDS[out.body.build]) out.body.build = 'regular';
  out.print.text = String(out.print.text||'').slice(0,16); out.print.sub = String(out.print.sub||'').slice(0,24);
  return out;
}

const $ = s => document.querySelector(s);
const sleeveColor = s => s.sleeve || s.color;
function patternDef(id, color, kind){
  const c2 = accentOf(color);
  let g = `<rect width="12" height="12" fill="${color}"/>`;
  if(kind==='border') g += `<rect y="7" width="12" height="5" fill="${c2}"/>`;
  if(kind==='check')  g += `<rect width="6" height="12" fill="${c2}" opacity=".42"/><rect width="12" height="6" fill="${c2}" opacity=".42"/>`;
  if(kind==='dot')    g += `<circle cx="3" cy="3" r="1.5" fill="${c2}"/><circle cx="9" cy="9" r="1.5" fill="${c2}"/>`;
  return `<pattern id="${id}" width="12" height="12" patternUnits="userSpaceOnUse">${g}</pattern>`;
}
function defs(){
  let d = `<linearGradient id="shade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000" stop-opacity=".17"/><stop offset=".3" stop-color="#fff" stop-opacity=".1"/>
      <stop offset=".56" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".2"/></linearGradient>
    <radialGradient id="floor"><stop offset="0" stop-color="#000" stop-opacity=".22"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>`;
  d += patternDef('pat-body', state.color, state.pattern) + patternDef('pat-sleeve', sleeveColor(state), state.pattern);
  for(const [k] of PATTERNS) d += patternDef('pv-'+k, state.color, k);
  return `<defs>${d}</defs>`;
}
// mini=true 이면 패턴 대신 단색(저장 썸네일용)
function ctx(s, mini){
  const z = (c, fill) => ({ fill: mini ? c : fill, line: lineOf(c) });
  return { b:z(s.color,'url(#pat-body)'), s:z(sleeveColor(s),'url(#pat-sleeve)'), t:{ fill:s.trim, line:lineOf(s.trim) }, k:{ fill:s.body.skin, line:mix(s.body.skin,-.22) } };
}
function printSvg(s){
  const p = s.print, text = p.text.trim();
  if(p.pos==='none' || !text) return '';
  const F = FONTS[p.font];
  const width = str => [...str].reduce((a,ch)=>a+(/[ᄀ-ᇿ㄰-㆏가-힯]/.test(ch)?1:.62),0);
  const line = (str, x, y, fs, max) => {
    const size = fs * F.k, fit = width(str)*size*.92 > max ? ` textLength="${max}" lengthAdjust="spacingAndGlyphs"` : '';
    return `<text x="${x}" y="${y}" text-anchor="middle" font-family="${F.css}, 'Black Han Sans', sans-serif" font-weight="${F.w}" font-size="${size}" fill="${p.color}"${fit}>${esc(str)}</text>`;
  };
  if(p.pos==='chest') return line(text, 177, 202, 10, 38) + (p.sub.trim() ? line(p.sub.trim(), 177, 212, 5.5, 38) : '');
  return line(text, 150, 236, 23, 90) + (p.sub.trim() ? line(p.sub.trim(), 150, 252, 9, 80) : '');
}
function figure(s, mini){
  const sk = { fill:s.body.skin, line:mix(s.body.skin,-.22) };
  const pants = { fill:s.body.base, line:lineOf(s.body.base) }, shoe = { fill:'#F4F4F1', line:'#A9AEB1' };
  let g = both(P(ARM,sk) + `<ellipse cx="76" cy="334" rx="9.5" ry="15" fill="${sk.fill}" stroke="${sk.line}"/>` + P(LEG,sk)) + P(NECK,sk) + P(TORSO,sk);
  g += both(P(SHOE,shoe) + `<path d="M105,600 H149 V606 Q149,608 147,608 H107 Q105,608 105,606 Z" fill="#E3E4E0" stroke="#A9AEB1" stroke-width=".9"/>`);
  g += P(PANTS,pants) + S('M106,298 H194',pants.line) + both(S('M126,300 V596',pants.line,.8));
  g += styleOf(s.style).draw(ctx(s, mini)) + printSvg(s);
  const k = BUILDS[s.body.build].k;
  const head = `<ellipse cx="150" cy="66" rx="27" ry="33" fill="${sk.fill}" stroke="${sk.line}" stroke-width="1.1"/><ellipse cx="150" cy="66" rx="27" ry="33" fill="url(#shade)"/>`;
  return `<ellipse cx="150" cy="610" rx="70" ry="9" fill="url(#floor)"/>
    <g transform="translate(150 0) scale(${k} 1) translate(-150 0)">${g}</g>${head}`;
}
function ruler(){
  const top = 33, bot = 608, px = (bot-top)/165;
  let d = '', t = '';
  for(let cm=0; cm<=160; cm+=10){
    const y = bot - cm*px, major = cm%50===0;
    d += `M${major?14:19},${y.toFixed(1)} H26 `;
    if(major) t += `<text x="30" y="${(y+3).toFixed(1)}">${cm}</text>`;
  }
  return `<g class="ruler"><path d="M26,${top} V${bot} ${d}" fill="none" stroke-width="1"/>${t}</g>`;
}

function renderStage(){
  $('#fig').innerHTML = defs() + ruler() + figure(state, false);
  $('#build-label').textContent = BUILDS[state.body.build].label;
  const p = state.print, pr = p.pos!=='none' && p.text.trim() ? ` · 프린트 "${p.text.trim()}"` : '';
  $('#caption').textContent = `${styleOf(state.style).name} · ${colorName(state.color)}${pr}`;
  $('#btn-undo').disabled = ui.hist.length===0;
}
function renderPresets(){
  const cur = JSON.stringify(state);
  $('#presets').innerHTML = PRESETS.map((p,i)=>{
    const dots = [p.s.color, p.s.sleeve||p.s.color, p.s.trim].map(c=>`<i style="background:${c}"></i>`).join('');
    const pressed = JSON.stringify(sanitize(p.s, state.body))===cur;
    return `<button class="chip" data-act="preset" data-i="${i}" data-key="preset-${i}" aria-pressed="${pressed}"><span class="dots">${dots}</span>${p.name}</button>`;
  }).join('');
}
function renderTabs(){
  $('#tabs').innerHTML = TABS.map(([id,l])=>`<button class="tab" role="tab" id="tab-${id}" data-act="tab" data-tab="${id}" data-key="tab-${id}" aria-selected="${ui.tab===id}">${l}</button>`).join('');
}
function styleTab(){
  const f = ctx(state, false);
  return `<div class="sec"><h3 class="sec-title">상의 스타일 <span>${styleOf(state.style).name}</span></h3>${
    GROUPS.map(g=>`<div class="grp-label">${g}</div><div class="styles">${
      STYLES.filter(s=>s.group===g).map(st=>`<button class="style-card" data-act="style" data-id="${st.id}" data-key="style-${st.id}" aria-pressed="${state.style===st.id}">
        <svg viewBox="50 86 200 284" aria-hidden="true">${st.draw(f)}</svg><span class="nm">${st.name}</span><span class="nt">${st.note}</span></button>`).join('')
    }</div>`).join('')}</div>`;
}
function paletteHtml(value, act){
  const v = value.toUpperCase();
  return PALETTE.map(g=>`<div class="pal-group"><span class="pal-label">${g.group}</span><div class="sw-row">${
    g.colors.map(([n,h])=>`<button class="sw" style="background:${h}" data-act="${act}" data-c="${h}" data-key="${act}-${h}" aria-pressed="${v===h}" aria-label="${n} ${h}" title="${n} ${h}"></button>`).join('')
  }</div></div>`).join('')
  + `<div class="pal-group"><span class="pal-label">사용자 지정</span><div class="custom">
      <input type="color" id="custom-color" value="${value}" aria-label="컬러 피커" data-act2="${act}">
      <input type="text" class="field" id="hex-input" value="${v}" maxlength="7" spellcheck="false" aria-label="HEX 코드 입력" data-act2="${act}">
      <span class="hex">Enter로 적용</span></div></div>`;
}
function currentHtml(value, extra=''){
  return `<div class="current"><span class="big" id="cur-swatch" style="background:${value}"></span><div><div class="nm" id="cur-name">${colorName(value)}</div><div class="hex" id="cur-hex">${value.toUpperCase()}</div></div>${extra}</div>`;
}
function colorTab(){
  const st = styleOf(state.style);
  if(st.noSleeve && ui.target==='sleeve') ui.target = 'color';
  const tg = ui.target;
  const value = tg==='trim' ? state.trim : tg==='sleeve' ? sleeveColor(state) : state.color;
  const opts = [['color','몸판',''], ...(st.noSleeve?[]:[['sleeve','소매', state.sleeve?'':'몸판과 같음']]), ['trim','배색',st.trimNote]];
  const seg = `<div class="seg" role="group" aria-label="색상 적용 부위">${opts.map(([k,l,n])=>`<button data-act="target" data-t="${k}" data-key="tgt-${k}" aria-pressed="${tg===k}">${l}${n?`<small>${n}</small>`:''}</button>`).join('')}</div>`;
  const relink = tg==='sleeve' && state.sleeve ? `<button class="btn link" data-act="relink" data-key="relink">몸판과 같은 색으로</button>` : '';
  const pats = PATTERNS.map(([k,n])=>`<button class="chip" data-act="pattern" data-k="${k}" data-key="pat-${k}" aria-pressed="${state.pattern===k}"><svg viewBox="0 0 18 18" aria-hidden="true"><rect width="18" height="18" fill="url(#pv-${k})"/></svg>${n}</button>`).join('');
  return `<div class="sec"><h3 class="sec-title">색상 적용 부위</h3>${seg}
      <p class="hint">${tg==='sleeve'?'소매만 다른 색으로 칠합니다. 나그랑·야구점퍼 배색에 쓰입니다.':tg==='trim'?`이 스타일의 배색 부위: ${st.trimNote}`:'몸판 색을 바꾸면 소매도 함께 바뀝니다(소매를 따로 정하지 않은 경우).'}</p>
      ${currentHtml(value, relink)}${paletteHtml(value,'color')}</div>
    <div class="sec"><h3 class="sec-title">원단 패턴 <span>몸판·소매에 적용</span></h3><div class="chips wrap">${pats}</div></div>`;
}
function printTab(){
  const p = state.print, F = FONTS[p.font];
  const pos = PRINT_POS.map(([k,l])=>`<button data-act="ppos" data-k="${k}" data-key="ppos-${k}" aria-pressed="${p.pos===k}">${l}</button>`).join('');
  const warn = p.pos==='center' && hasZip(state.style) ? `<p class="hint warn">이 스타일은 가운데에 지퍼나 단추가 있어 가슴 중앙 프린트가 갈라집니다. 왼쪽 가슴을 권장합니다.</p>` : '';
  const fonts = Object.entries(FONTS).map(([k,f])=>`<button class="font-card" data-act="pfont" data-k="${k}" data-key="pfont-${k}" aria-pressed="${p.font===k}">
      <span class="smp" style="font-family:${f.css},sans-serif;font-weight:${f.w}">${esc(p.text.trim()||'우리팀 2026')}</span><span class="nt">${f.label} · ${f.note}</span></button>`).join('');
  return `<div class="sec"><h3 class="sec-title">문구</h3>
      <div class="form-row"><label for="print-text">메인 문구 (최대 16자)</label><input class="field" id="print-text" maxlength="16" value="${esc(p.text)}" placeholder="예: 3학년 2반"></div>
      <div class="form-row"><label for="print-sub">보조 문구 (선택, 최대 24자)</label><input class="field" id="print-sub" maxlength="24" value="${esc(p.sub)}" placeholder="예: 2026 SPORTS DAY"></div></div>
    <div class="sec"><h3 class="sec-title">위치</h3><div class="seg" role="group" aria-label="프린트 위치">${pos}</div>${warn}</div>
    <div class="sec"><h3 class="sec-title">서체 <span>${F.label}</span></h3><div class="fonts">${fonts}</div></div>
    <div class="sec"><h3 class="sec-title">프린트 색상</h3>${currentHtml(p.color)}${paletteHtml(p.color,'pcolor')}</div>`;
}
function bodyTab(){
  const sk = SKINS.map(([n,h])=>`<button class="sw" style="background:${h};width:40px;height:40px" data-act="skin" data-c="${h}" data-key="skin-${h}" aria-pressed="${state.body.skin.toUpperCase()===h}" aria-label="${n}" title="${n}"></button>`).join('');
  const bd = Object.entries(BUILDS).map(([k,b])=>`<button data-act="build" data-k="${k}" data-key="build-${k}" aria-pressed="${state.body.build===k}">${b.label}</button>`).join('');
  const bs = BASES.map(([n,h])=>`<button class="chip" data-act="base" data-c="${h}" data-key="base-${h}" aria-pressed="${state.body.base===h}"><span class="dots"><i style="background:${h}"></i></span>${n}</button>`).join('');
  return `<div class="sec"><h3 class="sec-title">마네킹 톤 <span>${colorName(state.body.skin)}</span></h3><div class="sw-row">${sk}</div></div>
    <div class="sec"><h3 class="sec-title">체형</h3><div class="seg" role="group" aria-label="체형">${bd}</div></div>
    <div class="sec"><h3 class="sec-title">코디용 하의 <span>디자인 대상 아님</span></h3><div class="chips wrap">${bs}</div>
      <p class="hint">상의가 실제 착용 시 어떻게 보이는지 확인하기 위한 배경 하의입니다.</p></div>`;
}
function renderPanel(){
  const body = $('#panel-body');
  body.innerHTML = ({style:styleTab, color:colorTab, print:printTab, body:bodyTab})[ui.tab]();
  body.setAttribute('aria-labelledby','tab-'+ui.tab);
}
const patName = k => (PATTERNS.find(p=>p[0]===k)||PATTERNS[0])[1];
function specRows(){
  const s = state, st = styleOf(s.style), p = s.print;
  const rows = [
    ['스타일', `${st.name}`, st.group],
    ['몸판', s.color, patName(s.pattern)],
  ];
  if(!st.noSleeve) rows.push(['소매', sleeveColor(s), s.sleeve ? '배색' : '몸판과 동일']);
  rows.push(['배색', s.trim, st.trimNote]);
  rows.push(['프린트', p.pos==='none'||!p.text.trim() ? '없음' : `"${p.text.trim()}"${p.sub.trim()?` / "${p.sub.trim()}"`:''}`,
             p.pos==='none'||!p.text.trim() ? '' : `${PRINT_POS.find(x=>x[0]===p.pos)[1]} · ${FONTS[p.font].label} · ${colorName(p.color)} ${p.color.toUpperCase()}`]);
  return rows;
}
const isHex = v => HEXRE.test(v);
function renderSpec(){
  const rows = specRows();
  $('#spec').innerHTML = `<table class="spec"><tbody>${rows.map(([k,v,n])=>`<tr><th scope="row">${k}</th><td>${
    isHex(v) ? `<span class="cl"><i style="background:${v}"></i>${colorName(v)} <span class="hex">${v.toUpperCase()}</span></span>` : esc(v)
  }${n?`<br><small>${esc(n)}</small>`:''}</td></tr>`).join('')}</tbody></table>`;
  const d = new Date();
  $('#spec-date').textContent = `작성일 ${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
  $('#spec-text').textContent = '[단체복 피팅 랩 · 디자인 사양서]\n' + rows.map(([k,v,n])=>`${k}: ${isHex(v)?`${colorName(v)} ${v.toUpperCase()}`:v}${n?` (${n})`:''}`).join('\n');
}
function renderLooks(){
  if(!looks.length){ $('#looks').innerHTML = `<p class="empty">아직 저장한 디자인이 없습니다. 이름을 입력하고 저장하면 여기에서 다시 불러올 수 있습니다.</p>`; return; }
  $('#looks').innerHTML = `<div class="looks">${looks.map((l,i)=>`
    <div class="look"><button class="load" data-act="load" data-i="${i}" data-key="load-${i}" aria-label="${esc(l.name)} 불러오기">
      <svg viewBox="40 18 220 604" aria-hidden="true">${figure(l.s, true)}</svg><span class="nm">${esc(l.name)}</span></button>
      <button class="del${ui.armed===i?' armed':''}" data-act="del" data-i="${i}" data-key="del-${i}">${ui.armed===i?'삭제 확인':'삭제'}</button></div>`).join('')}</div>`;
}
function render(){
  const key = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.key : null;
  const fid = document.activeElement && document.activeElement.id;
  renderStage(); renderPresets(); renderTabs(); renderPanel(); renderSpec(); renderLooks();
  const el = key ? document.querySelector(`[data-key="${CSS.escape(key)}"]`) : (fid ? document.getElementById(fid) : null);
  if(el) el.focus({preventScroll:true});
}

/* ============================================================
   6) 상호작용
   ============================================================ */
let toastTimer;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),1900); }
function setColor(act, c){
  if(act==='pcolor'){ state.print.color = c; return; }
  if(ui.target==='trim') state.trim = c;
  else if(ui.target==='sleeve') state.sleeve = (c===state.color ? null : c);
  else state.color = c;
}
const pick = a => a[Math.floor(Math.random()*a.length)];
function randomLook(){
  const team = PALETTE[1].colors.map(c=>c[1]), basic = PALETTE[0].colors.map(c=>c[1]), all = PALETTE.flatMap(g=>g.colors.map(c=>c[1]));
  const st = pick(STYLES), color = pick(Math.random()<.6?team:all);
  const contrast = ['raglan','stadium'].includes(st.id) || Math.random()<.15;
  const ink = lum(color) < .3 ? '#F6F6F2' : '#1D1D1F';
  return sanitize({ style:st.id, color, sleeve: contrast ? pick(basic.filter(c=>c!==color)) : null, trim: pick([...basic, ...team]),
    pattern: Math.random()<.8 ? 'solid' : pick(PATTERNS)[0],
    print:{ text:state.print.text || '우리팀', sub:state.print.sub, pos: hasZip(st.id) ? 'chest' : pick(['chest','center']), font:pick(Object.keys(FONTS)), color:ink },
    body: state.body });
}

document.addEventListener('click', e=>{
  const b = e.target.closest('[data-act]'); if(!b) return;
  const act = b.dataset.act, d = b.dataset;
  if(act!=='del') ui.armed = null;
  switch(act){
    case 'tab': ui.tab = d.tab; render(); break;
    case 'style': commit(()=>{ state.style = d.id; }); break;
    case 'pattern': commit(()=>{ state.pattern = d.k; }); break;
    case 'target': ui.target = d.t; render(); break;
    case 'relink': commit(()=>{ state.sleeve = null; }); break;
    case 'color': case 'pcolor': commit(()=>setColor(act, d.c)); break;
    case 'ppos': commit(()=>{ state.print.pos = d.k; }); break;
    case 'pfont': commit(()=>{ state.print.font = d.k; }); break;
    case 'skin': commit(()=>{ state.body.skin = d.c; }); break;
    case 'build': commit(()=>{ state.body.build = d.k; }); break;
    case 'base': commit(()=>{ state.body.base = d.c; }); break;
    case 'preset': commit(()=>{ state = sanitize(clone(PRESETS[+d.i].s), state.body); }); toast(`'${PRESETS[+d.i].name}' 디자인을 입혔습니다`); break;
    case 'random': commit(()=>{ state = randomLook(); }); break;
    case 'reset': commit(()=>{ state = sanitize(clone(PRESETS[0].s)); }); toast('기본 디자인으로 되돌렸습니다'); break;
    case 'undo': if(ui.hist.length){ state = JSON.parse(ui.hist.pop()); store.set('gf-current',state); render(); } break;
    case 'load': commit(()=>{ state = sanitize(clone(looks[+d.i].s)); }); toast(`'${looks[+d.i].name}'을(를) 불러왔습니다`); break;
    case 'del': {
      const i = +d.i;
      if(ui.armed===i){ looks.splice(i,1); ui.armed=null; store.set('gf-looks',looks); toast('삭제했습니다'); }
      else ui.armed = i;
      renderLooks(); const el=document.querySelector(`[data-key="del-${i}"]`); if(el) el.focus(); break;
    }
    case 'copy': {
      const text = $('#spec-text').textContent;
      const fallback = ()=>{ const r=document.createRange(); r.selectNodeContents($('#spec')); const s=getSelection(); s.removeAllRanges(); s.addRange(r); toast('복사가 막혀 있어 표를 선택해 두었습니다. Ctrl+C로 복사하세요'); };
      try{ navigator.clipboard.writeText(text).then(()=>toast('사양 텍스트를 복사했습니다'), fallback); }catch(err){ fallback(); }
      break;
    }
  }
});
// 컬러 피커·문구 입력: 입력 중에는 스테이지만 갱신, 확정(change) 시 패널 전체 갱신
function live(fn){
  if(!ui.live){ snapshot(); ui.live = true; }
  fn(); store.set('gf-current', state); renderStage(); renderSpec();
}
document.addEventListener('input', e=>{
  const t = e.target;
  if(t.id==='custom-color') live(()=>{
    const c = t.value.toUpperCase(); setColor(t.dataset.act2, c);
    const sw=$('#cur-swatch'), nm=$('#cur-name'), hx=$('#cur-hex'), hi=$('#hex-input');
    if(sw) sw.style.background=c; if(nm) nm.textContent=colorName(c); if(hx) hx.textContent=c; if(hi) hi.value=c;
  });
  if(t.id==='print-text') live(()=>{ state.print.text = t.value.slice(0,16); if(state.print.pos==='none' && t.value.trim()) state.print.pos = hasZip(state.style)?'chest':'center'; });
  if(t.id==='print-sub')  live(()=>{ state.print.sub = t.value.slice(0,24); });
});
document.addEventListener('change', e=>{
  if(['custom-color','print-text','print-sub'].includes(e.target.id)){ ui.live=false; render(); }
});
document.addEventListener('keydown', e=>{
  if(e.target.id==='hex-input' && e.key==='Enter'){
    e.preventDefault();
    let v = e.target.value.trim(); if(!v.startsWith('#')) v = '#'+v;
    if(HEXRE.test(v)){ e.target.removeAttribute('aria-invalid'); const act=e.target.dataset.act2; commit(()=>setColor(act, v.toUpperCase())); }
    else { e.target.setAttribute('aria-invalid','true'); toast('HEX 코드는 #과 6자리(예: #1F2A44)로 입력하세요'); }
  }
});
$('#save-form').addEventListener('submit', e=>{
  e.preventDefault();
  const inp = $('#look-name');
  const name = (inp.value.trim() || `디자인 ${looks.length+1}`).slice(0,24);
  looks.unshift({ name, s:clone(state) });
  if(looks.length>24) looks.length = 24;
  store.set('gf-looks', looks); inp.value=''; renderLooks(); toast(`'${name}'을(를) 저장했습니다`);
});
// 웹폰트가 늦게 로드되면 SVG 프린트 글자를 다시 그림
if(document.fonts && document.fonts.ready) document.fonts.ready.then(()=>renderStage());

render();
</script>

</body>
</html>
