<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>유니폼 피팅 랩</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@500;600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Layout: 피팅 스테이지(좌·고정, 테크팩 도트 그리드) + 작업 패널(우). 모바일은 스테이지 상단 고정 + 패널 스크롤 */
:root{
  --bg:#ECF0EE; --surface:#FFFFFF; --sunk:#F3F6F5; --ink:#16201E; --muted:#5A6865;
  --line:#D2DAD7; --line-strong:#AEBAB6; --accent:#1C6A65; --accent-soft:#DCEDEA; --on-accent:#FFFFFF;
  --stage:#E1E7E4; --dot:rgba(22,32,30,.11); --shadow:rgba(22,32,30,.10);
  --f-display:"Hahmlet","Nanum Myeongjo",Georgia,serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1514; --surface:#171E1D; --sunk:#1D2524; --ink:#E4EBE9; --muted:#93A29F;
    --line:#2B3634; --line-strong:#465451; --accent:#62C0B6; --accent-soft:#1D3533; --on-accent:#0B1413;
    --stage:#131A19; --dot:rgba(228,235,233,.07); --shadow:rgba(0,0,0,.4); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1514; --surface:#171E1D; --sunk:#1D2524; --ink:#E4EBE9; --muted:#93A29F;
  --line:#2B3634; --line-strong:#465451; --accent:#62C0B6; --accent-soft:#1D3533; --on-accent:#0B1413;
  --stage:#131A19; --dot:rgba(228,235,233,.07); --shadow:rgba(0,0,0,.4); color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink); font:400 15px/1.55 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 40px;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto}

/* Header */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:20px 16px}
.eyebrow{font:500 .7rem/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.top h1{font:600 1.75rem/1.15 var(--f-display);margin:6px 0 0;letter-spacing:-.01em;text-wrap:balance}
.top p{margin:4px 0 0;color:var(--muted);font-size:.9rem;max-width:52ch}

/* App grid */
.app{display:grid;gap:20px;grid-template-columns:minmax(0,1fr)}
.stage{
  background-color:var(--stage); background-image:radial-gradient(var(--dot) 1px,transparent 1.3px); background-size:14px 14px;
  border:1px solid var(--line); border-radius:14px; overflow:hidden; display:flex; flex-direction:column; min-width:0;
}
@media (min-width:900px){
  .app{grid-template-columns:minmax(0,1fr) 440px;align-items:start}
  .stage{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);height:min(calc(100vh - 140px),860px);min-height:520px}
}
@media (max-width:899px){
  .stage{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;height:46vh;min-height:300px;box-shadow:0 6px 16px -10px var(--shadow)}
  .top{padding-block:14px 12px}
  .top h1{font-size:1.4rem}
}
.stage-head{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;flex-wrap:wrap}
.tag{font:500 .7rem/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;gap:10px;align-items:center}
.tag b{color:var(--ink);font-weight:500}
.tools{display:flex;gap:6px}
.stage svg#fig{flex:1;min-height:0;width:100%;display:block}
.stage-foot{padding:8px 12px 12px;font-size:.82rem;color:var(--muted);text-align:center;min-height:1.6em}
.ruler text{fill:var(--muted);font:9px var(--f-mono)}
.ruler path{stroke:var(--line-strong)}

/* Controls */
.btn{
  display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);
  border-radius:8px;padding:7px 11px;font-size:.84rem;font-weight:500;cursor:pointer;white-space:nowrap;
  transition:border-color .15s,background .15s;
}
.btn:hover:not(:disabled){border-color:var(--line-strong)}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn svg{width:15px;height:15px;flex:none}
.panel{display:flex;flex-direction:column;gap:16px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.sec{display:flex;flex-direction:column;gap:10px}
.sec + .sec{margin-top:18px;padding-top:16px;border-top:1px dashed var(--line)}
.sec-title{font:500 .72rem/1.2 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0;display:flex;justify-content:space-between;align-items:center;gap:8px}
.sec-title span{text-transform:none;letter-spacing:0;font-family:var(--f-body);color:var(--ink);font-size:.82rem}
h2.card-title{font:600 1.05rem/1.3 var(--f-display);margin:0 0 12px}

.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.chip{
  display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--sunk);border-radius:999px;
  padding:6px 12px 6px 7px;font-size:.84rem;cursor:pointer;white-space:nowrap;
}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.chip .dots{display:inline-flex}
.chip .dots i{width:14px;height:14px;border-radius:50%;border:1px solid var(--line-strong);margin-left:-4px}
.chip .dots i:first-child{margin-left:0}
.chip svg{width:18px;height:18px;border-radius:50%;border:1px solid var(--line-strong)}

.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);margin:-4px -4px 16px;padding:0 4px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:10px 12px;border-bottom:2px solid transparent;margin-bottom:-1px;color:var(--muted);font-weight:500;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

.styles{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.style-card{
  border:1px solid var(--line);background:var(--sunk);border-radius:10px;padding:8px 6px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;transition:border-color .15s;
}
.style-card:hover{border-color:var(--line-strong)}
.style-card[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.style-card svg{width:100%;height:78px}
.style-card .nm{font-size:.82rem;font-weight:500;line-height:1.3}
.style-card .nt{font-size:.7rem;color:var(--muted);line-height:1.3}
.none-ico{stroke:var(--line-strong);fill:none}

.seg{display:inline-flex;background:var(--sunk);border:1px solid var(--line);border-radius:9px;padding:3px;gap:2px;align-self:flex-start;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 12px;border-radius:6px;font-size:.84rem;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px var(--shadow)}

.current{display:flex;align-items:center;gap:12px}
.current .big{width:44px;height:44px;border-radius:10px;border:1px solid var(--line-strong);flex:none}
.current .nm{font-weight:600}
.hex{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.pal-group{display:flex;flex-direction:column;gap:6px}
.pal-label{font-size:.74rem;color:var(--muted)}
.sw-row{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:32px;height:32px;border-radius:50%;border:1px solid var(--line-strong);cursor:pointer;padding:0;transition:transform .12s}
.sw:hover{transform:scale(1.08)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ink)}
.custom{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.custom input[type=color]{width:44px;height:36px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:2px;cursor:pointer}
.custom input[type=text]{
  width:110px;height:36px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);
  font:500 .86rem var(--f-mono);padding:0 10px;text-transform:uppercase;
}
.custom input[aria-invalid="true"]{border-color:#C0392B}

.toggles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tg{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--sunk);cursor:pointer;text-align:left}
.tg .box{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--line-strong);flex:none;display:grid;place-items:center}
.tg[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.tg[aria-pressed="true"] .box{background:var(--accent);border-color:var(--accent)}
.tg[aria-pressed="true"] .box::after{content:"";width:8px;height:4px;border:2px solid var(--on-accent);border-top:0;border-right:0;transform:translateY(-1px) rotate(-45deg)}
.tg small{display:block;color:var(--muted);font-size:.72rem}

.table-wrap{overflow-x:auto}
table.spec{width:100%;border-collapse:collapse;font-size:.84rem}
.spec th{font:500 .68rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
.spec td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
.spec td:first-child{white-space:nowrap;color:var(--muted);font-size:.8rem}
.spec td small{display:block;color:var(--muted);font-size:.72rem}
.spec tr:last-child td{border-bottom:0}
.cl{display:inline-flex;align-items:flex-start;gap:6px;line-height:1.3}
.cl .hex{display:block;font-size:.72rem}
.cl i{width:14px;height:14px;border-radius:4px;border:1px solid var(--line-strong);flex:none;margin-top:2px}
.row-actions{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:12px;flex-wrap:wrap}
pre#spec-text{position:absolute;left:-9999px;top:0;white-space:pre}

.save-row{display:flex;gap:8px}
.save-row input{
  flex:1;min-width:0;height:36px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);padding:0 10px;font:inherit;font-size:.88rem;
}
.looks{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px;margin-top:12px}
.look{position:relative;border:1px solid var(--line);border-radius:10px;background:var(--sunk);padding:6px 6px 8px;display:flex;flex-direction:column;align-items:center}
.look .load{border:0;background:none;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;width:100%}
.look svg{width:100%;height:130px}
.look .nm{font-size:.78rem;font-weight:500;overflow-wrap:anywhere;text-align:center}
.look .del{position:absolute;top:4px;right:4px;border:1px solid var(--line);background:var(--surface);border-radius:6px;font-size:.68rem;padding:2px 6px;cursor:pointer;color:var(--muted)}
.look .del.armed{color:var(--on-accent);background:#B3261E;border-color:#B3261E}
.empty{color:var(--muted);font-size:.85rem;margin:10px 0 0}

.toast{
  position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);
  background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:.86rem;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:20;
}
.toast.show{opacity:1;transform:translate(-50%,0)}
#fig .layer{transition:opacity .2s}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:420px){.btn .lbl{display:none}.btn{padding:7px 9px}}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow">Virtual Fitting · Tech Pack</div>
      <h1>유니폼 피팅 랩</h1>
      <p>디자인과 색상을 고르면 마네킹에 바로 입혀 봅니다. 포인트 색, 패턴, 소품까지 조합해 시안을 비교해 보세요.</p>
    </div>
  </header>

  <main class="app">
    <section class="stage" aria-label="피팅 스테이지">
      <div class="stage-head">
        <div class="tag"><span>Front · 앞판</span><span>165 cm · 체형 <b id="build-label">보통</b></span></div>
        <div class="tools">
          <button class="btn" id="btn-undo" data-act="undo" data-key="undo" title="실행 취소">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg><span class="lbl">실행 취소</span></button>
          <button class="btn" data-act="random" data-key="random" title="랜덤 코디">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5"/><path d="M4 20 21 3"/><path d="M21 16v5h-5"/><path d="m15 15 6 6"/><path d="M4 4l5 5"/></svg><span class="lbl">랜덤</span></button>
          <button class="btn" data-act="reset" data-key="reset" title="기본 코디로 초기화">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg><span class="lbl">초기화</span></button>
        </div>
      </div>
      <svg id="fig" viewBox="0 18 300 604" preserveAspectRatio="xMidYMid meet" role="img" aria-label="현재 코디를 입은 마네킹"></svg>
      <div class="stage-foot" id="caption"></div>
    </section>

    <aside class="panel">
      <div class="card">
        <div class="sec">
          <h3 class="sec-title">예시 코디</h3>
          <div class="chips" id="presets"></div>
        </div>
      </div>

      <div class="card">
        <nav class="tabs" role="tablist" id="tabs" aria-label="편집 부위"></nav>
        <div id="panel-body" role="tabpanel"></div>
      </div>

      <div class="card">
        <h2 class="card-title">디자인 사양서</h2>
        <div class="table-wrap" id="spec"></div>
        <div class="row-actions">
          <span class="hex" id="spec-date"></span>
          <button class="btn" data-act="copy" data-key="copy">사양 텍스트 복사</button>
        </div>
        <pre id="spec-text" aria-hidden="true"></pre>
      </div>

      <div class="card">
        <h2 class="card-title">저장한 코디</h2>
        <form class="save-row" id="save-form">
          <label for="look-name" class="hex" style="position:absolute;left:-9999px">코디 이름</label>
          <input id="look-name" type="text" maxlength="24" placeholder="예: 3병동 하계 근무복 A안">
          <button class="btn primary" type="submit">현재 코디 저장</button>
        </form>
        <div id="looks"></div>
      </div>
    </aside>
  </main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ============================================================
   1) 데이터 — 디자인·색상·패턴·예시 코디 (확장 지점)
   ============================================================ */
const PALETTE = [
  { group:'의료 유니폼', colors:[['실 블루','#8FA6D0'],['로열 블루','#2E58A6'],['네이비','#1F2A44'],['틸','#23817E'],['헌터 그린','#2F5D45'],['와인','#6E2735'],['차콜','#3A4249'],['화이트','#F6F6F2']] },
  { group:'뉴트럴', colors:[['블랙','#1D1D1F'],['그레이','#9AA0A6'],['스톤','#C9C4BA'],['베이지','#D9C7AC'],['카멜','#B3874F'],['아이보리','#F2ECDF']] },
  { group:'파스텔', colors:[['민트','#A9DCCB'],['스카이','#B5D5EF'],['라일락','#C8B7E2'],['로즈','#E9B5C1'],['피치','#F4C4A6'],['버터','#F3E2A0']] },
  { group:'비비드', colors:[['레드','#D2283E'],['오렌지','#EE8A2A'],['옐로','#EFC12F'],['그린','#2E9E4F'],['블루','#1E63D2'],['퍼플','#6A41B3'],['마젠타','#BE1E7C']] },
];
const SKINS = [['화이트 마네킹','#ECE8E2'],['라이트 베이지','#E8CDB2'],['미디엄','#C99B76'],['딥 브라운','#8A5A40'],['스틸 그레이','#9EA4A6']];
const BUILDS = { slim:{label:'슬림',k:.92}, regular:{label:'보통',k:1}, broad:{label:'넓음',k:1.1} };
const PATTERNS = [['solid','솔리드'],['stripe','핀스트라이프'],['check','깅엄 체크'],['dot','도트']];
const PARTS = [
  { id:'top',    label:'상의',   garment:true, trimLabel:'포인트(파이핑·칼라·단추)' },
  { id:'bottom', label:'하의',   garment:true, trimLabel:'포인트(허리끈)' },
  { id:'outer',  label:'아우터', garment:true, trimLabel:'포인트(단추·여밈)' },
  { id:'shoes',  label:'신발',   trimLabel:'밑창' },
  { id:'acc',    label:'소품' },
  { id:'body',   label:'마네킹' },
];
const ACCS = [
  ['badge','명찰','가슴 왼쪽 이름표'],
  ['lanyard','사원증','목걸이형 ID 카드'],
  ['steth','청진기','목에 거는 형태'],
  ['cap','수술모','스크럽 캡'],
];

/* ============================================================
   2) 색상 유틸
   ============================================================ */
const rgb = h => { h=h.replace('#',''); return [0,2,4].map(i=>parseInt(h.slice(i,i+2),16)); };
const hex = (r,g,b) => '#'+[r,g,b].map(v=>Math.round(Math.max(0,Math.min(255,v))).toString(16).padStart(2,'0')).join('').toUpperCase();
const mix = (h,t) => { const [r,g,b]=rgb(h), to=t<0?0:255, a=Math.abs(t); return hex(r+(to-r)*a,g+(to-g)*a,b+(to-b)*a); };
const lum = h => { const [r,g,b]=rgb(h).map(v=>{v/=255;return v<=.03928?v/12.92:((v+.055)/1.055)**2.4;}); return .2126*r+.7152*g+.0722*b; };
const lineOf = c => mix(c, lum(c) < .05 ? .32 : -.36);
const accentOf = c => lum(c) > .42 ? mix(c,-.24) : mix(c,.3);
const NAMES = new Map([...PALETTE.flatMap(g=>g.colors), ...SKINS].map(([n,h])=>[h.toUpperCase(),n]));
const colorName = h => NAMES.get(h.toUpperCase()) || '사용자 지정';

/* ============================================================
   3) SVG 도형 — 좌표계 300×640, 중심선 x=150
   ============================================================ */
const P = (d,f) => `<path d="${d}" fill="${f.fill}" stroke="${f.line}" stroke-width="1.1" stroke-linejoin="round"/><path d="${d}" fill="url(#shade)"/>`;
const S = (d,c,w=1.1,dash=false) => `<path d="${d}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"${dash?' stroke-dasharray="2.6 2"':''}/>`;
const T = (d,f) => `<path d="${d}" fill="${f.trim}" stroke="${f.trimLine}" stroke-width=".9" stroke-linejoin="round"/>`;

};
function sanitize(s){
  const base = clone(PRESETS[0].s), out = {};
  for(const k of Object.keys(base)) out[k] = Object.assign({}, base[k], (s && s[k]) || {});
  for(const p of ['top','bottom','outer','shoes']) if(!STYLES[p].some(x=>x.id===out[p].style)) out[p].style = base[p].style;
  if(!BUILDS[out.body.build]) out.body.build = 'regular';
  return out;
}

const $ = s => document.querySelector(s);
function patternDef(id, color, kind){
  const c2 = accentOf(color);
  let g = `<rect width="12" height="12" fill="${color}"/>`;
  if(kind==='stripe') g += `<rect x="5.2" width="1.6" height="12" fill="${c2}"/>`;
  if(kind==='check')  g += `<rect width="6" height="12" fill="${c2}" opacity=".42"/><rect width="12" height="6" fill="${c2}" opacity=".42"/>`;
  if(kind==='dot')    g += `<circle cx="3" cy="3" r="1.5" fill="${c2}"/><circle cx="9" cy="9" r="1.5" fill="${c2}"/>`;
  return `<pattern id="${id}" width="12" height="12" patternUnits="userSpaceOnUse">${g}</pattern>`;
}
function defs(){
  let d = `<linearGradient id="shade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000" stop-opacity=".17"/><stop offset=".3" stop-color="#fff" stop-opacity=".1"/>
      <stop offset=".56" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".2"/></linearGradient>
    <radialGradient id="floor"><stop offset="0" stop-color="#000" stop-opacity=".22"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>`;
  for(const p of ['top','bottom','outer']) d += patternDef('pat-'+p, state[p].color, state[p].pattern);
  const pv = ['top','bottom','outer'].includes(ui.tab) ? state[ui.tab].color : '#9AA0A6';
  for(const [k] of PATTERNS) d += patternDef('pv-'+k, pv, k);
  return `<defs>${d}</defs>`;
}
// fillFor(part) → 본판 채우기(메인: 패턴 참조, 미니: 단색)
function partCtx(s, part, fillFor){
  const c = s[part].color, t = s[part].trim || c;
  return { fill:fillFor(part), color:c, line:lineOf(c), trim:t, trimLine:lineOf(t) };
}
function figure(s, fillFor){
  const sk = { fill:s.body.skin, line:mix(s.body.skin,-.22) };
  let g = both(P(ARM,sk) + `<ellipse cx="76" cy="334" rx="9.5" ry="15" fill="${sk.fill}" stroke="${sk.line}"/>` + P(LEG,sk)) + P(NECK,sk) + P(TORSO,sk);
  for(const part of ['shoes','bottom','top','outer']){
    const st = styleOf(part, s[part].style);
    g += `<g class="layer" data-part="${part}">${st.draw(partCtx(s,part,fillFor))}</g>`;
  }
  g += accSvg(s.acc);
  const k = BUILDS[s.body.build].k;
  let head = `<ellipse cx="150" cy="66" rx="27" ry="33" fill="${sk.fill}" stroke="${sk.line}" stroke-width="1.1"/><ellipse cx="150" cy="66" rx="27" ry="33" fill="url(#shade)"/>`;
  if(s.acc.cap){
    const c = s.acc.color, l = lineOf(c);
    head += `<path d="M121,62 C119,24 181,24 179,62 C168,56 132,56 121,62 Z" fill="${c}" stroke="${l}" stroke-width="1.1"/><path d="M121,62 C119,24 181,24 179,62 C168,56 132,56 121,62 Z" fill="url(#shade)"/>`
          + S('M123,55 C138,50 162,50 177,55',l,.9,true);
  }
  return `<ellipse cx="150" cy="610" rx="70" ry="9" fill="url(#floor)"/>
    <g transform="translate(150 0) scale(${k} 1) translate(-150 0)">${g}</g>${head}`;
}
function accSvg(a){
  const c = a.color, l = lineOf(c);
  let o = '';
  if(a.lanyard) o += S('M139,121 L147,234 M161,121 L153,234',c,2.6)
    + `<rect x="137" y="232" width="26" height="34" rx="2.5" fill="#FBFBF9" stroke="${l}" stroke-width=".9"/><rect x="141" y="237" width="9" height="11" fill="${c}" opacity=".55"/>`
    + S('M141,254 H159 M141,259 H155','#9AA3A1',1.6);
  if(a.badge) o += `<rect x="110" y="200" width="30" height="11" rx="1.5" fill="#FBFBF9" stroke="${l}" stroke-width=".8"/><rect x="110" y="200" width="30" height="3" rx="1" fill="${c}"/>`
    + S('M114,207.5 H134','#8A9391',1.4);
  if(a.steth) o += S('M137,123 C121,150 118,205 127,238',c,3.2) + S('M163,123 C177,146 179,182 172,206',c,3.2)
    + `<circle cx="127" cy="245" r="7.5" fill="#C9CED2" stroke="#7D868C" stroke-width="1.2"/><circle cx="127" cy="245" r="3.5" fill="#9AA2A8"/>`
    + S('M172,206 L166,222 M172,206 L178,222','#8E979D',2);
  return o;
}
function ruler(){
  const top = 33, bot = 608, px = (bot-top)/165;
  let d = '', t = '';
  for(let cm=0; cm<=160; cm+=10){
    const y = bot - cm*px, major = cm%50===0;
    d += `M${major?14:19},${y.toFixed(1)} H26 `;
    if(major) t += `<text x="30" y="${(y+3).toFixed(1)}">${cm}</text>`;
  }
  return `<g class="ruler"><path d="M26,${top} V${bot} ${d}" fill="none" stroke-width="1"/>${t}</g>`;
}

    const art = st.id==='none'
      ? `<svg viewBox="0 0 100 100" aria-hidden="true"><circle class="none-ico" cx="50" cy="50" r="24" stroke-width="3"/><path class="none-ico" d="M33 67 67 33" stroke-width="3"/></svg>`
      : `<svg viewBox="${THUMB_VB[part]}" aria-hidden="true">${st.draw(partCtx(state,part,mainFill))}</svg>`;
    return `<button class="style-card" data-act="style" data-part="${part}" data-id="${st.id}" data-key="style-${part}-${st.id}" aria-pressed="${pressed}">${art}<span class="nm">${st.name}</span><span class="nt">${st.note}</span></button>`;
  }).join('');
  return `<div class="sec"><h3 class="sec-title">디자인 <span>${styleOf(part,state[part].style).name}</span></h3><div class="styles">${cards}</div></div>`;
}
function patternSec(part){
  const chips = PATTERNS.map(([k,n])=>`<button class="chip" data-act="pattern" data-k="${k}" data-key="pat-${k}" aria-pressed="${state[part].pattern===k}"><svg viewBox="0 0 18 18" aria-hidden="true"><rect width="18" height="18" fill="url(#pv-${k})"/></svg>${n}</button>`).join('');
  return `<div class="sec"><h3 class="sec-title">패턴</h3><div class="chips" style="flex-wrap:wrap">${chips}</div></div>`;
}
function paletteHtml(value, act){
  const v = value.toUpperCase();
  return PALETTE.map(g=>`<div class="pal-group"><span class="pal-label">${g.group}</span><div class="sw-row">${
    g.colors.map(([n,h])=>`<button class="sw" style="background:${h}" data-act="${act}" data-c="${h}" data-key="${act}-${h}" aria-pressed="${v===h}" aria-label="${n} ${h}" title="${n} ${h}"></button>`).join('')
  }</div></div>`).join('')
  + `<div class="pal-group"><span class="pal-label">사용자 지정</span><div class="custom">
      <input type="color" id="custom-color" value="${value}" aria-label="컬러 피커" data-act2="${act}">
      <input type="text" id="hex-input" value="${v}" maxlength="7" spellcheck="false" aria-label="HEX 코드 입력" data-act2="${act}">
      <span class="hex">Enter로 적용</span></div></div>`;
}
function colorSec(part){
  const meta = PARTS.find(p=>p.id===part), tgt = ui.target[part];
  const value = tgt==='trim' ? state[part].trim : state[part].color;
  const seg = `<div class="seg" role="group" aria-label="색상 적용 대상">
      <button data-act="target" data-t="color" data-key="tgt-color" aria-pressed="${tgt==='color'}">${part==='shoes'?'갑피':'본판'}</button>
      <button data-act="target" data-t="trim" data-key="tgt-trim" aria-pressed="${tgt==='trim'}">${meta.trimLabel}</button></div>`;
  return `<div class="sec"><h3 class="sec-title">색상</h3>${seg}
    <div class="current"><span class="big" id="cur-swatch" style="background:${value}"></span><div><div class="nm" id="cur-name">${colorName(value)}</div><div class="hex" id="cur-hex">${value.toUpperCase()}</div></div></div>
    ${paletteHtml(value,'color')}</div>`;
}
function accSec(){
  const a = state.acc;
  const tg = ACCS.map(([k,n,d])=>`<button class="tg" data-act="acc" data-k="${k}" data-key="acc-${k}" aria-pressed="${!!a[k]}"><span class="box"></span><span>${n}<small>${d}</small></span></button>`).join('');
  return `<div class="sec"><h3 class="sec-title">소품 착용</h3><div class="toggles">${tg}</div></div>
    <div class="sec"><h3 class="sec-title">소품 색상 <span>명찰 띠 · 줄 · 청진기 · 수술모</span></h3>
    <div class="current"><span class="big" id="cur-swatch" style="background:${a.color}"></span><div><div class="nm" id="cur-name">${colorName(a.color)}</div><div class="hex" id="cur-hex">${a.color.toUpperCase()}</div></div></div>
    ${paletteHtml(a.color,'acccolor')}</div>`;
}
function bodySec(){
  const sk = SKINS.map(([n,h])=>`<button class="sw" style="background:${h};width:40px;height:40px" data-act="skin" data-c="${h}" data-key="skin-${h}" aria-pressed="${state.body.skin.toUpperCase()===h}" aria-label="${n}" title="${n}"></button>`).join('');
  const bd = Object.entries(BUILDS).map(([k,b])=>`<button data-act="build" data-k="${k}" data-key="build-${k}" aria-pressed="${state.body.build===k}">${b.label}</button>`).join('');
  return `<div class="sec"><h3 class="sec-title">마네킹 톤 <span>${colorName(state.body.skin)}</span></h3><div class="sw-row">${sk}</div></div>
    <div class="sec"><h3 class="sec-title">체형</h3><div class="seg" role="group" aria-label="체형">${bd}</div></div>`;
}
function renderPanel(){
  const t = ui.tab, part = PARTS.find(p=>p.id===t);
  let h = '';
  if(part.garment) h = designSec(t) + (state[t].style==='none' ? '' : patternSec(t) + colorSec(t));
  else if(t==='shoes') h = designSec(t) + colorSec(t);
  else if(t==='acc') h = accSec();
  else h = bodySec();
  const body = $('#panel-body');
  body.innerHTML = h;
  body.setAttribute('aria-labelledby','tab-'+t);
}
function patName(k){ return (PATTERNS.find(p=>p[0]===k)||PATTERNS[0])[1]; }
function specRows(){
  const s = state, r = [];
  r.push(['상의', styleOf('top',s.top.style).name, s.top.color, patName(s.top.pattern), s.top.trim]);
  r.push(['하의', styleOf('bottom',s.bottom.style).name, s.bottom.color, patName(s.bottom.pattern), s.bottom.trim]);
  if(s.outer.style!=='none') r.push(['아우터', styleOf('outer',s.outer.style).name, s.outer.color, patName(s.outer.pattern), s.outer.trim]);
  else r.push(['아우터','없음',null,'—',null]);
  r.push(['신발', styleOf('shoes',s.shoes.style).name, s.shoes.color, '—', s.shoes.trim]);
  const acc = ACCS.filter(([k])=>s.acc[k]).map(x=>x[1]).join(', ');
  r.push(['소품', acc || '없음', acc ? s.acc.color : null, '—', null]);
  r.push(['마네킹', BUILDS[s.body.build].label+' 체형', s.body.skin, '—', null]);
  return r;
}
const cl = h => h ? `<span class="cl"><i style="background:${h}"></i><span>${colorName(h)}<span class="hex">${h.toUpperCase()}</span></span></span>` : '—';
function renderSpec(){
  const rows = specRows();
  $('#spec').innerHTML = `<table class="spec"><thead><tr><th>부위</th><th>디자인</th><th>본판</th><th>포인트</th></tr></thead><tbody>${
    rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}${r[3]!=='—'?`<small>${r[3]}</small>`:''}</td><td>${cl(r[2])}</td><td>${cl(r[4])}</td></tr>`).join('')}</tbody></table>`;
  const d = new Date();
  $('#spec-date').textContent = `작성일 ${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
  const txt = h => h ? `${colorName(h)} ${h.toUpperCase()}` : '-';
  $('#spec-text').textContent = '[유니폼 피팅 랩 · 디자인 사양서]\n' + rows.map(r=>`${r[0]}: ${r[1]} / 본판 ${txt(r[2])} / 패턴 ${r[3]} / 포인트 ${txt(r[4])}`).join('\n');
}
function renderLooks(){
  if(!looks.length){ $('#looks').innerHTML = `<p class="empty">아직 저장한 코디가 없습니다. 이름을 입력하고 저장하면 여기에서 다시 불러올 수 있습니다.</p>`; return; }
  $('#looks').innerHTML = `<div class="looks">${looks.map((l,i)=>`
    <div class="look"><button class="load" data-act="load" data-i="${i}" data-key="load-${i}" aria-label="${l.name} 불러오기">
      <svg viewBox="40 18 220 604" aria-hidden="true">${figure(l.s, p=>l.s[p].color)}</svg><span class="nm">${l.name}</span></button>
      <button class="del${ui.armed===i?' armed':''}" data-act="del" data-i="${i}" data-key="del-${i}">${ui.armed===i?'삭제 확인':'삭제'}</button></div>`).join('')}</div>`;
}
function render(){
  const key = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.key : null;
  renderStage(); renderPresets(); renderTabs(); renderPanel(); renderSpec(); renderLooks();
  if(key){ const el = document.querySelector(`[data-key="${CSS.escape(key)}"]`); if(el) el.focus({preventScroll:true}); }
}

/* ============================================================
   6) 상호작용
   ============================================================ */
let toastTimer;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),1800); }
function setColor(act, c){
  if(act==='acccolor'){ state.acc.color = c; return; }
  const p = ui.tab; state[p][ui.target[p]==='trim'?'trim':'color'] = c;
}
const pick = a => a[Math.floor(Math.random()*a.length)];
function randomLook(){
  const uni = PALETTE[0].colors.map(c=>c[1]), all = PALETTE.flatMap(g=>g.colors.map(c=>c[1]));
  const s = clone(state);
  for(const p of ['top','bottom','outer']){
    const pool = p==='outer' && Math.random()<.45 ? STYLES.outer.filter(x=>x.id==='none') : STYLES[p].filter(x=>x.id!=='none');
    s[p].style = pick(pool).id; s[p].color = pick(Math.random()<.6?uni:all); s[p].trim = pick(all);
    s[p].pattern = Math.random()<.75 ? 'solid' : pick(PATTERNS)[0];
  }
  s.shoes.style = pick(STYLES.shoes).id; s.shoes.color = pick(['#F6F6F2','#1D1D1F','#1F2A44','#C9C4BA']); s.shoes.trim = pick(['#F6F6F2','#9AA0A6','#1D1D1F']);
  return s;
}

document.addEventListener('click', e=>{
  const b = e.target.closest('[data-act]'); if(!b) return;
  const act = b.dataset.act, d = b.dataset;
  if(act!=='del' && ui.armed!==null){ ui.armed = null; }
  switch(act){
    case 'tab': ui.tab = d.tab; render(); break;
    case 'style': commit(()=>{ state[d.part].style = d.id; }); break;
    case 'pattern': commit(()=>{ state[ui.tab].pattern = d.k; }); break;
    case 'target': ui.target[ui.tab] = d.t; render(); break;
    case 'color': case 'acccolor': commit(()=>setColor(act, d.c)); break;
    case 'acc': commit(()=>{ state.acc[d.k] = !state.acc[d.k]; }); break;
    case 'skin': commit(()=>{ state.body.skin = d.c; }); break;
    case 'build': commit(()=>{ state.body.build = d.k; }); break;
    case 'preset': commit(()=>{ state = sanitize(clone(PRESETS[+d.i].s)); }); toast(`'${PRESETS[+d.i].name}' 코디를 입혔습니다`); break;
    case 'random': commit(()=>{ state = randomLook(); }); break;
    case 'reset': commit(()=>{ state = sanitize(clone(PRESETS[0].s)); }); toast('기본 코디로 되돌렸습니다'); break;
    case 'undo': if(ui.hist.length){ state = JSON.parse(ui.hist.pop()); store.set('uf-current',state); render(); } break;
    case 'load': commit(()=>{ state = sanitize(clone(looks[+d.i].s)); }); toast(`'${looks[+d.i].name}'을(를) 불러왔습니다`); break;
    case 'del': {
      const i = +d.i;
      if(ui.armed===i){ looks.splice(i,1); ui.armed=null; store.set('uf-looks',looks); toast('삭제했습니다'); }
      else ui.armed = i;
      renderLooks(); const el=document.querySelector(`[data-key="del-${i}"]`); if(el) el.focus(); break;
    }
    case 'copy': {
      const text = $('#spec-text').textContent;
      const fallback = ()=>{ const r=document.createRange(); r.selectNodeContents($('#spec')); const s=getSelection(); s.removeAllRanges(); s.addRange(r); toast('복사가 막혀 있어 표를 선택해 두었습니다. Ctrl+C로 복사하세요'); };
      try{ navigator.clipboard.writeText(text).then(()=>toast('사양 텍스트를 복사했습니다'), fallback); }catch(err){ fallback(); }
      break;
    }
  }
});
// 컬러 피커: 드래그 중에는 스테이지만 갱신하고, 확정(change) 시 패널 전체 갱신
function liveColor(act, c){
  if(!ui.live){ ui.hist.push(JSON.stringify(state)); ui.live = true; }
  setColor(act, c); store.set('uf-current', state); renderStage(); renderSpec();
  const sw=$('#cur-swatch'), nm=$('#cur-name'), hx=$('#cur-hex'), hi=$('#hex-input');
  if(sw) sw.style.background=c; if(nm) nm.textContent=colorName(c); if(hx) hx.textContent=c.toUpperCase(); if(hi) hi.value=c.toUpperCase();
}
document.addEventListener('input', e=>{
  if(e.target.id==='custom-color') liveColor(e.target.dataset.act2, e.target.value.toUpperCase());
});
document.addEventListener('change', e=>{
  if(e.target.id==='custom-color'){ ui.live=false; render(); }
});
document.addEventListener('keydown', e=>{
  if(e.target.id==='hex-input' && e.key==='Enter'){
    e.preventDefault();
    let v = e.target.value.trim(); if(!v.startsWith('#')) v = '#'+v;
    if(/^#[0-9a-fA-F]{6}$/.test(v)){ e.target.removeAttribute('aria-invalid'); const act=e.target.dataset.act2; commit(()=>setColor(act, v.toUpperCase())); }
    else { e.target.setAttribute('aria-invalid','true'); toast('HEX 코드는 #과 6자리(예: #1F2A44)로 입력하세요'); }
  }
});
$('#save-form').addEventListener('submit', e=>{
  e.preventDefault();
  const inp = $('#look-name');
  const name = inp.value.trim() || `코디 ${looks.length+1}`;
  looks.unshift({ name:name.slice(0,24), s:clone(state), t:Date.now() });
  if(looks.length>24) looks.length = 24;
  store.set('uf-looks', looks); inp.value=''; renderLooks(); toast(`'${name}'을(를) 저장했습니다`);
});

render();
</script>
